environment:
  rebalance_frequency: weekly
  initial_capital: 100000
  transaction_cost_bps: 10  # 10 basis points
  max_position_size: 0.2  # 20% per stock
  portfolio_size: 10  # Hold 10 stocks
  
  reward_function: risk_adjusted_return
  risk_penalty: 0.5
  
  action_type: discrete  # or continuous